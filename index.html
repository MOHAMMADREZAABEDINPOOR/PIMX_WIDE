<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101112" />
    <meta
      name="description"
      content="PIMX WIDE — رمزنگاری محلی متن و فایل، گاوصندوق شخصی و اشتراک‌گذاری رمز‌شده."
    />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/loader.css" />
    <script src="/boot.js"></script>
    <title>PIMX WIDE | Local encryption tools</title>
  </head>
  <body>
    <div
      id="startup-loader"
      class="app-loader"
      role="status"
      aria-live="polite"
    >
      <div class="loader-content">
        <div class="loader-mechanism" aria-hidden="true">
          <div class="loader-orbit"></div>
          <div class="loader-orbit inner"></div>
          <div class="loader-core">
            <svg
              width="66"
              height="66"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1"
              stroke-linecap="round"
            >
              <path
                d="M8 16c0-2 0-6 4-6s4 4 4 6M12 13v8M5 19c1-3-2-12 7-12s6 9 7 12M2 14C1 7 5 3 12 3s11 4 10 11M8 20c1-2 1-3 1-5M15 21c-1-2-1-4-1-6"
              />
            </svg>
          </div>
          <i class="loader-satellite"></i>
        </div>
        <div class="loader-brand">PIMX <span>WIDE</span></div>
        <p id="startup-message">
          <span class="loader-fa">در حال آماده‌کردن فضای کار…</span
          ><span class="loader-en">Preparing your workspace…</span>
        </p>
        <div class="loader-track" aria-hidden="true"><i></i></div>
        <small
          ><span class="loader-fa">رمزنگاری روی دستگاه شما</span
          ><span class="loader-en">Encryption on your device</span></small
        >
        <a id="startup-retry" href="" hidden
          ><span class="loader-fa">بارگذاری دوباره</span
          ><span class="loader-en">Reload page</span></a
        >
      </div>
    </div>
    <div id="root" inert></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
