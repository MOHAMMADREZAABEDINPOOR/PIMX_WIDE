name = "pimx-wide"
compatibility_date = "2024-12-01"
pages_build_output_dir = "dist"

# Production currently runs device-local tools without a D1 binding.
# Add a real database UUID here when enabling links and administrator analytics.
# Local database development uses wrangler.local.toml instead.

# KV Namespace binding — must match the binding name configured in
# Cloudflare Dashboard → Pages → Your Project → Settings → Functions → KV namespace bindings
# Variable name: PIMX_VISITS
[[kv_namespaces]]
binding = "PIMX_VISITS"
id = "6748c2f590ef4e70aa014528fcd506a6"  # Replace after creating KV in Cloudflare Dashboard
