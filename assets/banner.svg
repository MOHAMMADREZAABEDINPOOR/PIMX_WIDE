<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="wdBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#020d18" /><stop offset="50%" stop-color="#071c33" /><stop offset="100%" stop-color="#01070e" /></linearGradient>
    <linearGradient id="wdNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"><animate attributeName="stop-color" values="#00f0ff;#10b981;#6366f1;#00f0ff" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="50%" stop-color="#10b981"><animate attributeName="stop-color" values="#10b981;#3b82f6;#00f0ff;#10b981" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="100%" stop-color="#6366f1"><animate attributeName="stop-color" values="#6366f1;#00f0ff;#10b981;#6366f1" dur="7s" repeatCount="indefinite" /></stop>
    </linearGradient>
    <linearGradient id="wdGrid" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#00f0ff" stop-opacity="0" /><stop offset="100%" stop-color="#10b981" stop-opacity="0.35" /></linearGradient>
    <filter id="wdGlow"><feGaussianBlur stdDeviation="5" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
  </defs>

  <style>
    @keyframes wdFloat { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    .floating-cipher { animation: wdFloat 6s ease-in-out infinite; }
  </style>

  <rect width="1200" height="360" fill="url(#wdBg)" />

  <g opacity="0.65">
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1" />
    <line x1="600" y1="260" x2="0" y2="360" stroke="url(#wdGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="200" y2="360" stroke="url(#wdGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="400" y2="360" stroke="url(#wdGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="600" y2="360" stroke="url(#wdGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="800" y2="360" stroke="url(#wdGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="1000" y2="360" stroke="url(#wdGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="1200" y2="360" stroke="url(#wdGrid)" stroke-width="1.5" />
    <line x1="0" y1="290" x2="1200" y2="290" stroke="#00f0ff" stroke-opacity="0.2" stroke-width="1" />
    <line x1="0" y1="330" x2="1200" y2="330" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5" />
  </g>

  <circle cx="200" cy="110" r="140" fill="#00f0ff" opacity="0.08" filter="url(#wdGlow)" />
  <circle cx="960" cy="170" r="160" fill="#10b981" opacity="0.12" filter="url(#wdGlow)" />

  <!-- 3D Isometric Cryptographic Lock & 256-bit Key Matrix -->
  <g transform="translate(940, 180)" class="floating-cipher">
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#wdNeon)" stroke-width="2" stroke-dasharray="8 6" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite" />
    </circle>
    <!-- Isometric Outer Hex Shield -->
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="#061a2b" stroke="#00f0ff" stroke-width="2.5" filter="url(#wdGlow)" opacity="0.95" />
    <!-- Inner Lock Plate -->
    <circle cx="0" cy="0" r="45" fill="#020c17" stroke="#10b981" stroke-width="2" />
    <!-- Keyhole -->
    <circle cx="0" cy="-8" r="8" fill="#00f0ff" filter="url(#wdGlow)" />
    <polygon points="-4,-8 4,-8 7,16 -7,16" fill="#00f0ff" />

    <!-- Center Core Glow -->
    <circle cx="0" cy="-8" r="12" fill="#00f0ff" filter="url(#wdGlow)">
      <animate attributeName="r" values="10;14;10" dur="3s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#00f0ff;#10b981;#6366f1;#00f0ff" dur="7s" repeatCount="indefinite" />
    </circle>

    <!-- Floating Badges -->
    <g transform="translate(-120, -50)">
      <rect x="0" y="0" width="85" height="22" rx="6" fill="#041220" stroke="#00f0ff" stroke-width="1" />
      <text x="42" y="15" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#00f0ff" text-anchor="middle">AES-256-GCM</text>
    </g>
    <g transform="translate(65, 30)">
      <rect x="0" y="0" width="85" height="22" rx="6" fill="#041220" stroke="#10b981" stroke-width="1" />
      <text x="42" y="15" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#34d399" text-anchor="middle">PBKDF2 SHA256</text>
    </g>
    <g transform="translate(-40, 70)">
      <rect x="0" y="0" width="85" height="22" rx="6" fill="#041220" stroke="#6366f1" stroke-width="1" />
      <text x="42" y="15" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#a5b4fc" text-anchor="middle">23 LANGUAGES</text>
    </g>
  </g>

  <!-- Left Typography -->
  <g transform="translate(80, 140)">
    <g transform="translate(0, -35)">
      <rect x="0" y="-14" width="280" height="24" rx="12" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="1" />
      <circle cx="12" cy="-2" r="4" fill="#00f0ff" />
      <text x="26" y="2" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#00f0ff" letter-spacing="2">CRYPTOGRAPHIC SUITE // NIST SP 800</text>
    </g>

    <text x="0" y="32" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="52" font-weight="900" fill="url(#wdNeon)" filter="url(#wdGlow)" letter-spacing="3">
      PIMX_WIDE
    </text>

    <text x="0" y="68" font-family="'Fira Code', monospace" font-size="16" font-weight="600" fill="#e2e8f0" letter-spacing="1">
      ⚡ Multilingual AES-256-GCM Text &amp; File Encryption Platform (23+ Languages)
    </text>

    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="165" height="26" rx="6" fill="#041426" stroke="#00f0ff" stroke-width="1" />
      <text x="82" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#00f0ff" text-anchor="middle">🔒 AES-256-GCM</text>

      <rect x="175" y="0" width="160" height="26" rx="6" fill="#041426" stroke="#10b981" stroke-width="1" />
      <text x="255" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">⚡ Web Crypto API</text>

      <rect x="345" y="0" width="150" height="26" rx="6" fill="#041426" stroke="#6366f1" stroke-width="1" />
      <text x="420" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#a5b4fc" text-anchor="middle">🌐 23 Languages</text>

      <rect x="505" y="0" width="150" height="26" rx="6" fill="#041426" stroke="#ec4899" stroke-width="1" />
      <text x="580" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#f472b6" text-anchor="middle">📁 File Streaming</text>
    </g>
  </g>

  <line x1="0" y1="358" x2="1200" y2="358" stroke="url(#wdNeon)" stroke-width="3" filter="url(#wdGlow)" />
</svg>